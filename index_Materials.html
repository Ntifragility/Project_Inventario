<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPC Takeoff ⚡</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --s1: #161b22;
            --s2: #1c2128;
            --s3: #242a31;
            --b1: #30363d;
            --b2: #21262d;
            --tx: #e6edf3;
            --mu: #8b949e;
            --di: #484f58;
            --am: #f0a500;
            --ad: rgba(240, 165, 0, .11);
            --ab: rgba(240, 165, 0, .28);
            --gn: #3fb950;
            --rd: #f85149;
            --rdd: rgba(248, 81, 73, .1);
            --ui: 'Barlow Condensed', sans-serif;
            --mo: 'IBM Plex Mono', monospace;
        }

        body.light-theme {
            --bg: #f6f8fa;
            --s1: #ffffff;
            --s2: #f0f3f6;
            --s3: #e1e4e8;
            --b1: #d0d7de;
            --b2: #c0c7ce;
            --tx: #000000;
            --mu: #222222;
            --di: #444444;
            --am: #bf7300;
            --ad: rgba(191, 115, 0, .11);
            --ab: rgba(191, 115, 0, .28);
            --gn: #1a7f37;
            --rd: #d1242f;
            --rdd: rgba(209, 36, 47, .1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            font-size: 14px
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font-family: var(--ui);
            min-height: 100vh
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        ::-webkit-scrollbar-track {
            background: var(--bg)
        }

        ::-webkit-scrollbar-thumb {
            background: var(--b1);
            border-radius: 3px
        }

        /* Inputs */
        input,
        select,
        textarea {
            font-family: inherit;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-radius: 6px;
            color: var(--tx);
            padding: 7px 11px;
            font-size: 13px;
            outline: none;
            transition: border-color .15s
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--am)
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            appearance: none;
        }

        /* Buttons */
        button {
            cursor: pointer;
            font-family: var(--ui);
            transition: opacity .15s
        }

        button:hover {
            opacity: .85
        }

        .btn-primary {
            background: var(--am);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .8px
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--b1);
            border-radius: 6px;
            color: var(--mu);
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px
        }

        .btn-ghost:hover {
            border-color: var(--mu);
            color: var(--tx);
            opacity: 1
        }

        .btn-danger {
            border-color: rgba(248, 81, 73, .4) !important;
            color: var(--rd) !important
        }

        .btn-danger:hover {
            border-color: var(--rd) !important;
            background: var(--rdd) !important
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--b2);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            color: var(--mu);
            font-family: var(--ui)
        }

        .btn-green {
            background: var(--gn);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700
        }

        .btn-export {
            background: var(--gn);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        /* Layout */
        .header {
            background: var(--s1);
            border-bottom: 1px solid var(--b1);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .logo {
            color: var(--am);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 14px 0;
            white-space: nowrap
        }

        .logo span {
            color: var(--mu);
            font-weight: 400;
            font-size: 13px;
            margin-left: 10px;
            letter-spacing: 1px
        }

        .nav {
            display: flex
        }

        .nav-tab {
            background: none;
            border: none;
            color: var(--mu);
            padding: 18px 20px 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-bottom: 2px solid transparent;
            transition: all .15s
        }

        .nav-tab.active {
            color: var(--am);
            border-bottom-color: var(--am)
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .item-count {
            color: var(--mu);
            font-size: 12px;
            font-family: var(--mo);
            white-space: nowrap
        }

        .main {
            padding: 24px;
            max-width: 1540px;
            margin: 0 auto
        }

        /* Card */
        .card {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 10px;
            padding: 20px
        }

        /* Fields */
        .field {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .field-label {
            font-size: 11px;
            color: var(--mu);
            letter-spacing: 1.5px;
            font-weight: 700
        }

        .add-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap
        }

        /* Mode toggle */
        .mode-toggle {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--b1)
        }

        .mode-btn {
            background: var(--s2);
            color: var(--mu);
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px
        }

        .mode-btn.active {
            background: var(--am);
            color: #000
        }

        /* Autocomplete */
        .ac-wrap {
            position: relative;
            flex: 1;
            min-width: 200px
        }

        .ac-input {
            width: 100%;
            font-family: var(--mo);
            font-size: 12px
        }

        .ac-dropdown {
            position: absolute;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            z-index: 300;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-radius: 8px;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
            display: none
        }

        .ac-option {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--b2)
        }

        .ac-option:last-child {
            border-bottom: none
        }

        .ac-option:hover {
            background: var(--ad)
        }

        .ac-opt-name {
            font-family: var(--mo);
            font-size: 11px;
            color: var(--am);
            font-weight: 500;
            margin-bottom: 2px
        }

        .ac-opt-sub {
            font-size: 10px;
            color: var(--mu)
        }

        .ac-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--di);
            text-align: center
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px
        }

        .search-input {
            flex: 1
        }

        /* Package groups */
        .pkg-group {
            margin-bottom: 14px
        }

        .pkg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--ad);
            border: 1px solid var(--ab);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            user-select: none
        }

        .pkg-header.collapsed {
            border-radius: 8px
        }

        .pkg-header-left {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .pkg-chevron {
            color: var(--am);
            font-size: 10px;
            transition: transform .2s;
            display: inline-block
        }

        .pkg-name-lbl {
            color: var(--am);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px
        }

        .pkg-count-lbl {
            color: var(--am);
            font-size: 11px;
            font-family: var(--mo)
        }

        .pkg-body {
            border: 1px solid var(--b1);
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow-x: auto;
            overflow-y: hidden
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 1400px;
        }

        table,
        table input,
        table th,
        table td,
        .td-n,
        .td-d,
        .td-q,
        .td-u,
        .edit-input-mono {
            font-family: "Aptos Narrow", sans-serif !important;
        }

        col.c-n { width: 40px }
        col.c-mat { width: 40px }
        col.c-plano { width: 170px }
        col.c-rev { width: 30px }
        col.c-t-unico { width: 140px }
        col.c-t-plano { width: 75px }
        col.c-det { width: 95px }

        /* Freeze Panes Logic (columns 1-6) */
        th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 10; background: inherit; }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 40px; z-index: 10; background: inherit; }
        th:nth-child(3), td:nth-child(3) { position: sticky; left: 80px; z-index: 10; background: inherit; }
        th:nth-child(4), td:nth-child(4) { position: sticky; left: 250px; z-index: 10; background: inherit; }
        th:nth-child(5), td:nth-child(5) { position: sticky; left: 280px; z-index: 10; background: inherit; }
        th:nth-child(6), td:nth-child(6) { position: sticky; left: 420px; z-index: 10; background: inherit; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }

        /* Ensure header parts are also sticky and above rows */
        thead th:nth-child(-n+6) { z-index: 20; background: var(--s2) !important; }
        
        /* Ensure rows have background so sticky cells aren't transparent */
        tr.tr-row td { background: var(--s1); }
        tr.tr-row:hover td { background: var(--s2); }
        tr.tr-edit td { background: var(--ad) !important; }

        col.c-d {
            width: auto
        }

        col.c-q {
            width: 70px
        }

        col.c-mo {
            width: 75px
        }

        col.c-u {
            width: 70px
        }

        col.c-no {
            width: 120px
        }

        col.c-a {
            width: 82px
        }

        thead tr {
            background: var(--s2);
            border-bottom: 1px solid var(--b1)
        }

        th {
            padding: 8px 10px;
            text-align: center !important;
            vertical-align: middle !important;
            color: var(--mu);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px
        }

        th:first-child {
            text-align: center
        }

        .tr-row {
            transition: background .1s
        }

        .tr-row:hover td {
            background: var(--s2)
        }

        .tr-edit td {
            background: var(--ad) !important
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--b2);
            vertical-align: middle;
            text-align: center;
        }

        tr:last-child td {
            border-bottom: none
        }

        .td-n {
            text-align: center;
            color: var(--di);
            font-size: 11px;
            font-family: var(--mo)
        }

        .td-d {
            font-family: var(--mo);
            font-size: 11px;
            word-break: break-word
        }

        .td-q {
            font-family: var(--mo);
            font-size: 13px;
            color: var(--am);
            font-weight: 500
        }

        .td-u {
            font-size: 11px;
            color: var(--mu);
            font-family: var(--mo)
        }

        .td-no {
            font-size: 11px;
            color: var(--mu);
            font-style: italic
        }

        .td-no.has-notes {
            color: var(--tx);
            font-style: normal
        }

        .td-a {
            text-align: center
        }

        .act-row {
            display: flex;
            gap: 4px;
            justify-content: center
        }

        .edit-input {
            width: 100%;
            padding: 4px 7px;
            font-size: 12px
        }

        .edit-input-mono {
            font-family: var(--mo)
        }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 56px 0;
            color: var(--di)
        }

        .empty-icon {
            font-size: 28px;
            margin-bottom: 10px
        }

        .empty-title {
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--mu)
        }

        .empty-sub {
            font-size: 12px
        }

        /* View headers */
        .view-hd {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 12px
        }

        .view-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px
        }

        .view-sub {
            color: var(--mu);
            font-size: 13px;
            margin-top: 4px
        }

        /* Rule cards */
        .rule-card {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px
        }

        .rule-card-row {
            display: flex;
            align-items: flex-start;
            gap: 12px
        }

        .rule-trigger {
            font-family: var(--mo);
            font-size: 12px;
            color: var(--am);
            font-weight: 500;
            margin-bottom: 10px
        }

        .rule-subitems {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1
        }

        .rule-sub {
            display: flex;
            gap: 10px;
            font-size: 11px;
            font-family: var(--mo);
            color: var(--mu);
            padding-left: 14px;
            border-left: 2px solid var(--b1)
        }

        .rule-sub-n {
            color: var(--di);
            min-width: 18px
        }

        .rule-sub-d {
            flex: 1
        }

        .rule-sub-q {
            color: var(--am)
        }

        .rule-card-acts {
            display: flex;
            gap: 8px;
            flex-shrink: 0
        }

        /* Rule editor */
        .rule-editor {
            background: var(--s2);
            border: 1px solid var(--ab);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px
        }

        .rule-editor-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--am);
            margin-bottom: 16px
        }

        .sub-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px
        }

        .sub-n {
            color: var(--di);
            font-size: 12px;
            font-family: var(--mo);
            min-width: 20px
        }

        .sub-del {
            background: none;
            border: none;
            color: var(--di);
            font-size: 15px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1
        }

        .sub-del:hover {
            color: var(--rd)
        }

        .rule-editor-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--b1)
        }

        /* Package CRUD */
        .pkg-add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            max-width: 600px
        }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 600px
        }

        .pkg-item {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .pkg-item-icon {
            color: var(--am);
            font-size: 13px
        }

        .pkg-item-name {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: .5px
        }

        .pkg-item-acts {
            display: flex;
            gap: 8px
        }

        .pkg-edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .modal {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 12px;
            width: 100%;
            max-width: 640px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5)
        }

        .modal-hd {
            padding: 18px 22px;
            border-bottom: 1px solid var(--b1);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .modal-hd-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--mu);
            font-size: 18px;
            line-height: 1;
            padding: 0
        }

        .modal-body {
            padding: 22px;
            overflow-y: auto;
            flex: 1
        }

        .modal-ft {
            padding: 14px 22px;
            border-top: 1px solid var(--b1);
            display: flex;
            gap: 10px;
            justify-content: flex-end
        }

        .mb-16 {
            margin-bottom: 16px
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-left: 3px solid var(--gn);
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 13px;
            color: var(--tx);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
            animation: tsIn .2s ease-out;
            pointer-events: none
        }

        .toast.warn {
            border-left-color: var(--am)
        }

        @keyframes tsIn {
            from {
                transform: translateY(16px);
                opacity: 0
            }
        }

        /* Confirm badge */
        .confirm-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--rdd);
            border: 1px solid var(--rd);
            border-radius: 4px;
            font-size: 11px;
            color: var(--rd);
            letter-spacing: .5px
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div style="display:flex;align-items:center;gap:28px">
            <div class="logo">⚡ EPC TAKEOFF <span>METRADO ELÉCTRICO</span></div>
            <nav class="nav">
                <button class="nav-tab active" id="nav-takeoff" onclick="APP.setTab('takeoff')">METRADO</button>
                <button class="nav-tab" id="nav-rules" onclick="APP.setTab('rules')">REGLAS</button>
                <button class="nav-tab" id="nav-packages" onclick="APP.setTab('packages')">PARTIDAS</button>
            </nav>
        </div>
        <div class="header-right">
            <button class="btn-icon" style="font-size:16px;padding:3px 8px;border-color:transparent"
                onclick="APP.toggleTheme()" id="theme-btn" title="Toggle Theme">☀️</button>
            <button class="btn-ghost" style="padding:4px 10px;font-size:11px" onclick="APP.clearCache()"
                title="Restablecer Datos">🗑️ RESTABLECER</button>
            <span class="item-count" id="item-count">0 ítems</span>
            <button class="btn-export" onclick="APP.exportCSV()">↓ EXPORTAR CSV</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main" id="main-content"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" style="display:none" onclick="APP.closeModalOnBackdrop(event)">
        <div class="modal" id="modal-box">
            <div class="modal-hd">
                <span class="modal-hd-title" id="modal-title">REGLA</span>
                <button class="modal-close" onclick="APP.closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-ft">
                <button class="btn-ghost" onclick="APP.closeModal()">CANCELAR</button>
                <button class="btn-primary" id="modal-save" onclick="APP.saveRule()">GUARDAR REGLA</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none"></div>

    <script>
        // ── uid
        function uid() { return Math.random().toString(36).slice(2, 10) }

        // ── Seed data
        const SEED_RULES = [
            {
                id: 'r1', trigger: 'CABLE DESNUDO 4/0 AWG', subitems: [
                    { id: 's1', desc: 'CABLE DESNUDO 4/0 AWG', qty: 1, unit: 'm' },
                    { id: 's2', desc: 'CINTA AMARILLA', qty: 1, unit: 'm' },
                    { id: 's3', desc: 'TIERRA DE CULTIVO', qty: 'length x 0.375 x 0.5', unit: 'm3' },
                ]
            },
            {
                id: 'r2', trigger: 'CABLE DESNUDO 2/0 AWG', subitems: [

        // DETALLE variants for CABLE DESNUDO 2/0 AWG (r2)

        const DETALLE_VARIANTS = {

            ]

        // Known "middle" descriptions that get swapped by DETALLE variants
        const R2_SWAPPABLE = [
            'TERMINAL A COMPRESION UN OJAL 1/2 PARA CABLE 2/0 YAV',
            'PERNO 1/2"X1 1/2" DE ACERO GALVANIZADO, CON TUERCA, DOBLE ARANDELA PLANA Y UNA DE PRESIÓN',

            'SOLDADURA VS', 'CARGA 90', 'MOLDE HSC-2G',
            'PRENSA PARALELA 1 CONDUCTOR 4- 2/0 AWG GCM26 BURNDY',
            'PRENSA PARALELA 2 CONDUCTOR 4- 2/0 AWG GCM26 BURNDY',
            'PRENSA PARALELA 2 CONDUCTORES 4- 2/0 AWG GCM26 BURNDY'
        ];

        // Apply DETALLE variant: remove old middle items, insert new ones
        function applyDetalleVariant(tagPlano, pkgId, detalleCode) {
            const variant = DETALLE_VARIANTS[detalleCode];
            if (!variant) return;

            // Find sibling items: same tagPlano, pkgId, ruleId=r2
            const siblings = S.items.filter(it =>
                it.ruleId === 'r2' && it.tagPlano === tagPlano && it.pkgId === pkgId
            );
            if (siblings.length === 0) return;

            // Find the index of the first sibling in S.items
            const firstIdx = S.items.indexOf(siblings[0]);

            // Remove old swappable items
            const swapUp = R2_SWAPPABLE.map(s => s.toUpperCase());
            const toRemove = siblings.filter(it => swapUp.includes(it.desc.toUpperCase()));
            toRemove.forEach(it => {
                const idx = S.items.indexOf(it);
                if (idx !== -1) S.items.splice(idx, 1);
            });

            // Handle TUBERIA dynamic requirements
            const refItem = siblings[0];
            const cableItem = siblings.find(sib => sib.desc.toUpperCase().includes('CABLE DESNUDO 2/0 AWG'));
            let tuberiaItem = siblings.find(sib => sib.desc.toUpperCase().includes('TUBERIA'));
            const cableOt = cableItem ? (parseFloat(cableItem.metradoOt) || 0) : 0;

            if (detalleCode === '153') {
                if (tuberiaItem) {
                    const idx = S.items.indexOf(tuberiaItem);
                    if (idx !== -1) S.items.splice(idx, 1);
                }
            } else {
                if (!tuberiaItem) {
                    const insertTubAt = cableItem ? S.items.indexOf(cableItem) + 1 : S.items.indexOf(refItem) + 1;
                    tuberiaItem = {
                        id: uid(), pkgId: refItem.pkgId,
                        desc: 'TUBERIA PVC SCH 80 Ø3/4"', qty: 1, unit: 'm',
                        notes: '', ruleId: 'r2',
                        material: 'C',
                        plano: refItem.plano, rev: refItem.rev,
                        tagUnico: '', tagPlano: tagPlano,
                        detalle: detalleCode, metradoOt: detalleCode === '152' ? '1.5' : '1'
                    };
                    S.items.splice(insertTubAt, 0, tuberiaItem);
                } else {
                    tuberiaItem.metradoOt = detalleCode === '152' ? '1.5' : '1';
                }
            }

            // Find where to insert (after TUBERIA, or immediately after cable)
            const insertAt = tuberiaItem && S.items.indexOf(tuberiaItem) !== -1 ? S.items.indexOf(tuberiaItem) + 1 : (cableItem ? S.items.indexOf(cableItem) + 1 : firstIdx + 1);

            const newMiddle = variant.map(v => {
                let finalOt = v.ot !== undefined ? v.ot : '';
                if (v.otDynamic === '1c/3m') {
                    finalOt = Math.ceil(cableOt / 3).toString();
                } else if (v.otDynamic === 'empty') {
                    finalOt = '';
                }
                return {
                    id: uid(), pkgId: refItem.pkgId,
                    desc: v.desc, qty: v.qty, unit: v.unit,
                    notes: '', ruleId: 'r2',
                    material: isPrimaryMaterial(v.desc) ? 'P' : 'C',
                    plano: refItem.plano, rev: refItem.rev,
                    tagUnico: '', tagPlano: tagPlano,
                    detalle: detalleCode, metradoOt: finalOt
                };
            });

            S.items.splice(insertAt, 0, ...newMiddle);

            // Update DETALLE on all siblings
            S.items.filter(it =>
                it.ruleId === 'r2' && it.tagPlano === tagPlano && it.pkgId === pkgId
            ).forEach(it => { 
                it.detalle = detalleCode; 
            });
        }

        const SEED_PACKAGES = [{ id: 'p1', name: 'GENERAL' }];

        // ── State
        const S = {

        // ── Storage
        function loadData() {
            try {
                const r = localStorage.getItem('epc-rules');
                const p = localStorage.getItem('epc-packages');
                const i = localStorage.getItem('epc-items');
                S.rules = r ? JSON.parse(r) : JSON.parse(JSON.stringify(SEED_RULES));
                S.packages = p ? JSON.parse(p) : JSON.parse(JSON.stringify(SEED_PACKAGES));
                S.items = i ? JSON.parse(i) : [];

                if (r) {
                    let rulesUpdated = false;
                    SEED_RULES.forEach(seedRule => {
                        const existingRule = S.rules.find(rule => rule.id === seedRule.id);
                        if (!existingRule) {
                            S.rules.push(JSON.parse(JSON.stringify(seedRule)));
                            rulesUpdated = true;
                        } else {
                            existingRule.subitems.forEach(existingSub => {
                                const descUp = existingSub.desc.toUpperCase();
                                if (existingRule.trigger.toUpperCase().includes('POZO')) {
                                    if (descUp.includes('CEMENTO GEM') && existingSub.qty !== 1) {
                                        existingSub.qty = 1;
                                        rulesUpdated = true;
                                    }
                                    if (descUp.includes('TIERRA DE CULTIVO') && existingSub.qty !== 4.71) {
                                        existingSub.qty = 4.71;
                                        rulesUpdated = true;
                                    }
                                }
                                if (existingRule.trigger.toUpperCase().includes('CABLE DESNUDO') && descUp.includes('TIERRA DE CULTIVO') && existingSub.qty !== 'length x 0.375 x 0.5') {
                                    existingSub.qty = 'length x 0.375 x 0.5';
                                    rulesUpdated = true;
                                }
                                if (descUp.includes('MOLDE') && existingSub.qty !== 0.0167) {
                                    existingSub.qty = 0.0167;
                                    rulesUpdated = true;
                                }
                            });
                        }
                    });
                    if (rulesUpdated) localStorage.setItem('epc-rules', JSON.stringify(S.rules));
                }

                if (!r) localStorage.setItem('epc-rules', JSON.stringify(SEED_RULES));
                if (!p) localStorage.setItem('epc-packages', JSON.stringify(SEED_PACKAGES));

                // Restore persisted PLANO and REV
                const savedPlano = localStorage.getItem('epc-plano');
                const savedRev = localStorage.getItem('epc-rev');
                if (savedPlano) S.customPlano = savedPlano;
                if (savedRev) S.customRev = savedRev;
            } catch (e) {
                S.rules = JSON.parse(JSON.stringify(SEED_RULES));
                S.packages = JSON.parse(JSON.stringify(SEED_PACKAGES));
                S.items = [];
            }
            S.selPkg = S.packages[0]?.id || null;
        }
        function saveData() {
            localStorage.setItem('epc-rules', JSON.stringify(S.rules));
            localStorage.setItem('epc-packages', JSON.stringify(S.packages));

            localStorage.setItem('epc-plano', S.customPlano || '');

            const noPkgs = S.packages.length === 0;

            + SUBIR CSV
            <input type="file" accept=".csv" style="display:none" onchange="APP.handleCSVUpload(event)">

      </div>

                    }

      </div>`: `
      <div class="field" style="flex:2;min-width:200px">
        <div class="field-label">DESCRIPCIÓN</div>
        <input id="custom-desc" type="text" value="${esc(S.customDesc)}"
          style="font-family:var(--mo);font-size:12px"

            const searchBar = `

    <span class="item-count">${APP.filteredItems().length} / ${S.items.length} ítems</span>
  </div>`;

            const table = `<div id="table-container">${APP.htmlTableGroups()}</div>`;

            return addPanel + searchBar + table;

        APP.htmlTableGroups = function () {

                return `<div class="empty"><div class="empty-icon">⚡</div><div class="empty-title">Sin ítems aún</div><div class="empty-sub">Usa una regla o agrega ítems manualmente</div></div>`;

            }
            const groups = [];
            S.packages.forEach(pkg => {
                const its = filtered.filter(it => it.pkgId === pkg.id);
                if (its.length > 0) groups.push({ pkg, its });
            });
            const unassigned = filtered.filter(it => !S.packages.find(p => p.id === it.pkgId));
            if (unassigned.length > 0) groups.push({ pkg: { id: '__none', name: 'SIN PARTIDA' }, its: unassigned });
            if (groups.length === 0) return `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Sin resultados</div></div>`;
            return groups.map(({ pkg, its }) => APP.htmlGroup(pkg, its)).join('');
        };

        APP.htmlGroup = function (pkg, items) {
            const collapsed = S.collapsedPkgs.has(pkg.id);
            return `
  <div class="pkg-group">
    <div class="pkg-header${collapsed ? ' collapsed' : ''}" onclick="APP.togglePkg('${pkg.id}')">
      <div class="pkg-header-left">
        <span class="pkg-chevron">${collapsed ? '▶' : '▼'}</span>

      </div>
      <span class="pkg-count-lbl">${items.length} ítem${items.length !== 1 ? 's' : ''}</span>
    </div>
    ${collapsed ? '' :
                    `<div class="pkg-body">

        APP.handleCSVUpload = function (event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                const rows = text.split(/\r?\n/).filter(r => r.trim());
                if (rows.length < 2) { APP.toast('CSV vacío o inválido', 'warn'); event.target.value = ''; return; }

                let addedCount = 0;
                const pkgId = S.selPkg || S.packages[0]?.id || null;
                const preSnapshot = JSON.stringify(S.items);

                // Saltar encabezado
                for (let i = 1; i < rows.length; i++) {
                    const parts = rows[i].split(',');
                    if (parts.length < 2) continue;
                    const tagRaw = parts[0].trim();
                    const lengthRaw = parseFloat(parts[1].trim());
                    const detalleRaw = parts.length > 2 ? parts[2].trim() : '';
                    if (!tagRaw || isNaN(lengthRaw)) continue;

                    let ruleName = null;
                    const tagUp = tagRaw.toUpperCase();
                    if (tagUp.startsWith('TT')) ruleName = 'SOLDADURA T 4/0';
                    else if (tagUp.startsWith('T')) ruleName = 'SOLDADURA T 4/0 - 2/0';
                    else if (tagUp.startsWith('X')) ruleName = 'SOLDADURA X 4/0';
                    else if (tagUp.startsWith('C')) ruleName = 'CABLE DESNUDO 4/0 AWG';
                    else if (tagUp.startsWith('M')) ruleName = 'CABLE DESNUDO 2/0 AWG';

                    if (!ruleName) continue;
                    const rule = S.rules.find(r => r.trigger === ruleName);
                    if (!rule) continue;

                    const planoVal = (S.customPlano || '').toUpperCase();
                    const newItems = rule.subitems.map((s, idx) => {
                        const mat = isPrimaryMaterial(s.desc) ? 'P' : 'C';
                        let metradoOt = '';
                        const descUp = s.desc.toUpperCase();
                        const isPozoRule = ruleName && ruleName.toUpperCase().includes('POZO');
                        
                        if (isPozoRule && descUp.includes('TIERRA DE CULTIVO')) {
                            metradoOt = '4.71';
                        } else if (isPozoRule && descUp.includes('CEMENTO GEM')) {
                            metradoOt = '22.6';
                        } else if (descUp.includes('TIERRA DE CULTIVO')) {
                            metradoOt = Math.ceil(0.375 * 0.5 * lengthRaw * 10) / 10;
                        } else if (descUp.includes('MOLDE')) {
                            metradoOt = '0.0167';
                        } else if (ruleName === 'CABLE DESNUDO 2/0 AWG' && (descUp.includes('TERMINAL') || descUp.includes('PERNO') || descUp.includes('SOLDADURA') || descUp.includes('CARGA') || descUp.includes('TUBERIA'))) {
                            metradoOt = '1';
                        } else if (ruleName && (ruleName.toUpperCase().includes('SOLDADURA') || isPozoRule)) {
                            metradoOt = '1';
                        } else {
                            metradoOt = lengthRaw;
                        }
                        return {
                            id: uid(), pkgId,
                            desc: s.desc,
                            qty: s.qty,
                            unit: s.unit, notes: '', ruleId: rule.id,
                            material: mat,
                            plano: planoVal,
                            rev: (S.customRev || '').toUpperCase(),
                            tagUnico: generateTagUnico(planoVal, tagRaw, mat),
                            tagPlano: tagRaw,
                            detalle: (detalleRaw || (tagRaw.startsWith('C') ? '167/G1' : '')),
                            metradoOt: metradoOt
                        };
                    });
                    // Add .01, .02 suffixes only when 2+ P items share the same tagPlano
                    const pItems = newItems.filter(it => it.material === 'P' && it.tagUnico);
                    const tagGroups = {};
                    pItems.forEach(it => {
                        if (!tagGroups[it.tagPlano]) tagGroups[it.tagPlano] = [];
                        tagGroups[it.tagPlano].push(it);
                    });
                    Object.values(tagGroups).forEach(group => {
                        if (group.length > 1) {
                            group.forEach((it, i) => {
                                it.tagUnico += '.' + String(i + 1).padStart(2, '0');
                            });
                        }
                    });
                    S.items.push(...newItems);
                    
                    if (rule.id === 'r2') {
                        const rowDetalle = detalleRaw || (tagRaw.startsWith('C') ? '167/G1' : '');
                        if (rowDetalle) {
                            applyDetalleVariant(tagRaw, pkgId, rowDetalle.toUpperCase());
                        }
                    }

                    addedCount += newItems.length;
                }

                event.target.value = '';
                if (addedCount > 0) {
                    S.undoSnapshot = preSnapshot;
                    saveData();
                    APP.render();
                    APP.toast(`${addedCount} ítems agregados desde CSV`);
                } else {
                    APP.toast('No se encontraron reglas aplicables', 'warn');
                }
            };
            reader.readAsText(file);
        };

        APP.applyTrigger = function (ruleId) {
            const rule = S.rules.find(r => r.id === ruleId);
            if (!rule) return;

            let numInstances = 1;
            const upTrigger = rule.trigger.toUpperCase();

            // Check if rule is CABLE DESNUDO 4/0 AWG or CABLE DESNUDO 2/0 AWG
            const isCableRule = upTrigger.includes('CABLE DESNUDO 4/0 AWG') || upTrigger.includes('CABLE DESNUDO 2/0 AWG');

            if (upTrigger.includes('SOLDADURA') || upTrigger.includes('POZO') || isCableRule) {
                const countInput = window.prompt(`¿Cuántas veces deseas agregar la regla:\n"${rule.trigger}"?`, '1');
                if (countInput === null) return; // Cancelled
                numInstances = parseInt(countInput, 10);
                if (isNaN(numInstances) || numInstances < 1) return;
            }

            // For SOLDADURA or POZO rules with multiple instances, ask for base TAG EN PLANO
            let baseTagPlano = '';
            if (numInstances > 1 && (upTrigger.includes('SOLDADURA') || upTrigger.includes('POZO') || isCableRule)) {
                baseTagPlano = window.prompt(`Ingresa el TAG EN PLANO BASE (ej: M04) para ${numInstances} instancias de:\n"${rule.trigger}"\n\nSe crearán secuencialmente: ${getSequentialTagsExample('M04', numInstances)}`, '');
                if (baseTagPlano === null) return; // Cancelled
            } else {
                baseTagPlano = window.prompt(`Ingresa el TAG EN PLANO para la regla seleccionada: ${rule.trigger}\n(Dejar en blanco si no aplica)`);
                if (baseTagPlano === null) return; // Cancelled
                baseTagPlano = baseTagPlano || '';
            }

            // For CABLE DESNUDO 2/0 AWG, use DETALLE '151' as standard
            let detalle = '';
            const tagForDetalle = (baseTagPlano || '').trim().toUpperCase();
            const startsWithC = tagForDetalle.startsWith('C');
            const defaultDet = startsWithC ? '167/G1' : '';

            if (upTrigger.includes('CABLE DESNUDO 2/0 AWG')) {
                detalle = '151'; // Standard DETALLE
            } else {
                detalle = window.prompt(`Ingresa el DETALLE para la regla seleccionada: ${rule.trigger}\n(Dejar en blanco si no aplica)`, defaultDet);
                if (detalle === null) return; // Cancelled
                detalle = detalle || '';
            }

            const planoVal = (S.customPlano || '').toUpperCase();
            const pkgId = S.selPkg || S.packages[0]?.id || null;
            const preSnapshot = JSON.stringify(S.items);

            const newItems = [];
            for (let i = 0; i < numInstances; i++) {
                // Calculate sequential tagPlano for each instance
                let currentTagPlano = baseTagPlano;
                if (numInstances > 1 && baseTagPlano) {
                    currentTagPlano = getSequentialTag(baseTagPlano, i);
                }

                rule.subitems.forEach((s) => {
                    const mat = isPrimaryMaterial(s.desc) ? 'P' : 'C';
                    // For SOLDADURA or POZO rules, set METRADO OT to 1
                    const isSoldaduraPozo = upTrigger.includes('SOLDADURA') || upTrigger.includes('POZO');

                    let metradoOt = '';
                        const descUp = s.desc.toUpperCase();
                        const isPozoTrigger = upTrigger.includes('POZO');

                        if (isPozoTrigger && descUp.includes('TIERRA DE CULTIVO')) {
                            metradoOt = '4.71';
                        } else if (isPozoTrigger && descUp.includes('CEMENTO GEM')) {
                            metradoOt = '22.6';
                        } else if (isSoldaduraPozo) {
                            metradoOt = '1';
                        } else if (upTrigger.includes('CABLE DESNUDO 2/0 AWG')) {
                        // For CABLE DESNUDO 2/0 AWG rule, set METRADO OT = 1 for TERMINAL, PERNO, SOLDADURA, CARGA, TUBERIA items
                        const descUpper = s.desc.toUpperCase();
                        if (descUpper.includes('TERMINAL') || descUpper.includes('PERNO') ||
                            descUpper.includes('SOLDADURA') || descUpper.includes('CARGA') ||
                            descUpper.includes('TUBERIA')) {
                            metradoOt = '1';
                        }
                    }
                    // For all rules, set METRADO OT = 0.0167 for MOLDE items
                    if (s.desc.toUpperCase().includes('MOLDE')) {
                        metradoOt = '0.0167';
                    }

                    newItems.push({
                        id: uid(), pkgId,
                        desc: s.desc, qty: s.qty, unit: s.unit, notes: '', ruleId: rule.id,
                        material: mat,
                        plano: planoVal,
                        rev: (S.customRev || '').toUpperCase(),
                        tagUnico: generateTagUnico(planoVal, currentTagPlano, mat),
                        tagPlano: currentTagPlano,
                        detalle: detalle,
                        metradoOt: metradoOt
                    });
                });
            }

            // Add .01, .02 suffixes only when 2+ P items share the same tagPlano
            const pItems = newItems.filter(it => it.material === 'P' && it.tagUnico);
            const tagGroups = {};
            pItems.forEach(it => {
                if (!tagGroups[it.tagPlano]) tagGroups[it.tagPlano] = [];
                tagGroups[it.tagPlano].push(it);
            });
            Object.values(tagGroups).forEach(group => {
                if (group.length > 1) {
                    group.forEach((it, i) => {
                        it.tagUnico += '.' + String(i + 1).padStart(2, '0');
                    });
                }
            });
            S.items.push(...newItems);
            
            // Execute DETALLE substitutions after elements are successfully mounted onto S.items!
            if (rule.id === 'r2') {
                const uniqueTags = [...new Set(newItems.map(it => it.tagPlano))];
                uniqueTags.forEach(tag => applyDetalleVariant(tag, pkgId, detalle));
            }
            
            S.triggerQuery = '';
            S.undoSnapshot = preSnapshot;
            saveData();
            APP.render();
            APP.toast(`${newItems.length} ítems agregados`);
        };

        APP.syncGlobalContext = function () {
            if (S.items.length === 0) { APP.toast('No hay ítems para actualizar', 'warn'); return; }
            if (!S.customPlano || S.customPlano.split('-').length < 6) {
                APP.toast('Ingresa un PLANO válido antes de sincronizar', 'warn');
                return;
            }

            const msg = `¿Actualizar los ${S.items.length} ítems del metrado con el nuevo PLANO y REV?\n\n` +
                `PLANO: ${S.customPlano}\n` +
                `REV: ${S.customRev || '-'}\n\n` +
                `Esto recalculará todos los TAG ÚNICO.`;
            if (!confirm(msg)) return;

            // Group by original tagPlano to maintain suffixes correctly
            const groups = {};
            S.items.forEach(it => {
                it.plano = S.customPlano;
                it.rev = (S.customRev || '').toUpperCase();
                
                // Recalculate base Tag Unico
                const mat = it.material || (isPrimaryMaterial(it.desc) ? 'P' : 'C');
                it.material = mat;
                it.tagUnico = generateTagUnico(it.plano, it.tagPlano, mat);

                if (mat === 'P' && it.tagPlano) {
                    if (!groups[it.tagPlano]) groups[it.tagPlano] = [];
                    groups[it.tagPlano].push(it);
                }
            });

            // Re-apply suffixes for P items sharing the same tagPlano
            Object.values(groups).forEach(group => {
                if (group.length > 1) {
                    group.forEach((it, i) => {
                        it.tagUnico += '.' + String(i + 1).padStart(2, '0');
                    });
                }

            saveData();
            APP.render();
            APP.toast('Metrado actualizado con el nuevo PLANO');

        APP.saveItem = function (id) {
            const qty = +(document.getElementById('edit-qty')?.value || 0);
            const unit = (document.getElementById('edit-unit')?.value || '').toUpperCase();
            const notes = document.getElementById('edit-notes')?.value || '';
            const material = (document.getElementById('edit-mat')?.value || '').toUpperCase();
            const plano = (document.getElementById('edit-plano')?.value || '').toUpperCase();
            const rev = (document.getElementById('edit-rev')?.value || '').toUpperCase();
            const tagUnico = document.getElementById('edit-t-unico')?.value || '';
            const tagPlano = document.getElementById('edit-t-plano')?.value || '';
            const detalle = document.getElementById('edit-det')?.value || '';
            const metradoOt = document.getElementById('edit-mot')?.value || '';

            const it = S.items.find(i => i.id === id);
            const oldDetalle = it ? (it.detalle || '') : '';
            const oldMetradoOt = it ? (it.metradoOt || '') : '';
            if (it) { Object.assign(it, { qty, unit, notes, material, plano, rev, tagUnico, tagPlano, detalle, metradoOt }); }

            // If DETALLE changed on a CABLE DESNUDO 2/0 AWG group item, swap siblings
            if (it && it.ruleId === 'r2' && detalle !== oldDetalle && detalle) {
                applyDetalleVariant(it.tagPlano, it.pkgId, detalle.toUpperCase());
            } else if (it && it.ruleId && detalle !== oldDetalle) {
                // For any other rule, just sync the DETALLE text across its group siblings
                S.items.filter(sib =>
                    sib.ruleId === it.ruleId &&
                    sib.tagPlano === it.tagPlano &&
                    sib.pkgId === it.pkgId
                ).forEach(sib => { sib.detalle = detalle; });
            }

            // If CABLE DESNUDO 4/0 AWG METRADO OT changed, update corresponding TIERRA DE CULTIVO
            if (it && it.ruleId === 'r1' && it.desc.toUpperCase().includes('CABLE DESNUDO 4/0 AWG') && metradoOt !== oldMetradoOt) {
                // Find all items in the same set (same ruleId, tagPlano, pkgId)
                const setItems = S.items.filter(sib =>
                    sib.ruleId === it.ruleId &&
                    sib.tagPlano === it.tagPlano &&
                    sib.pkgId === it.pkgId
                );

                // Update CINTA AMARILLA with same METRADO OT
                const cintaItem = setItems.find(sib => sib.desc.toUpperCase().includes('CINTA AMARILLA'));
                if (cintaItem) {
                    cintaItem.metradoOt = metradoOt;
                }

                // Calculate and update TIERRA DE CULTIVO: 0.375 * 0.5 * cableMetradoOt
                const tierraItem = setItems.find(sib => sib.desc.toUpperCase().includes('TIERRA DE CULTIVO'));
                if (tierraItem) {
                    const cableValue = parseFloat(metradoOt) || 0;
                    const tierraValue = 0.375 * 0.5 * cableValue;
                    tierraItem.metradoOt = tierraValue.toFixed(2);
                }
            }

            // If CABLE DESNUDO 2/0 AWG METRADO OT changed, update corresponding PRENSA PARALELA if DETALLE is 153
            if (it && it.ruleId === 'r2' && it.desc.toUpperCase().includes('CABLE DESNUDO 2/0 AWG') && metradoOt !== oldMetradoOt) {
                const setItems = S.items.filter(sib =>
                    sib.ruleId === it.ruleId &&
                    sib.tagPlano === it.tagPlano &&
                    sib.pkgId === it.pkgId
                );
                
                if (it.detalle === '153') {
                    const prensaItems = setItems.filter(sib => sib.desc.toUpperCase().includes('PRENSA PARALELA 1 CONDUCTOR'));
                    const cableValue = parseFloat(metradoOt) || 0;
                    const computed = Math.ceil(cableValue / 3).toString();
                    
                    prensaItems.forEach(p => {
                        p.metradoOt = computed;
                    });
                }
            }

            S.editingItem = null;
            saveData();
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
            APP.toast('Ítem actualizado');
        };

        // Helper to determine if an item should be primary material (P)
        function isPrimaryMaterial(desc) {
            const primaryList = [
                'BARRA',
                'CABLE DESNUDO 4/0 AWG',
                'CABLE DESNUDO 2/0 AWG',
                'CAJA REGISTRO 400 x 400 x 300 mm',
                'CEMENTO GEM (11.3 kg x bls)',

                'SOLDADURA T 4/0',
                'SOLDADURA VS',
                'SOLDADURA X 4/0',
                'TERMINAL DE COBRE 5/8"X48" MODELO',
                'TUBERIA PVC SCH 80 Ø1"',
                'TUBERIA PVC SCH 80 Ø3/4"',
                'VARILLA COPPERWELD 3/4"X2.4M'
            ];
            const up = desc.toUpperCase();
            return primaryList.some(p => up.includes(p.toUpperCase()));
        }

        // Helper to determine if an item should show quantity (CANT. column)
        function isCountable(desc) {
            const list = [
                'BARRA',
                'CABLE DESNUDO 2/0 AWG',
                'CABLE DESNUDO 4/0 AWG',
                'CEMENTO GEM',
                'PARARRAYO EN POSTE DE 15M',
                'PARARRAYO EN POSTE DE 3M',
                'POSTE 15 M',
                'POZO CON CAJA REGISTRO',
                'POZO SIN CAJA REGISTRO',
                'SOLDADURA T 4/0',
                'SOLDADURA VS',
                'SOLDADURA X 4/0',
                'TERMINAL DE COBRE 5/8"X48"',
                'TUBERIA PVC SCH 80 Ø1"',
                'TUBERIA PVC SCH 80 Ø3/4"'
            ];
            const up = desc.toUpperCase();
            return list.some(p => up.includes(p));
        }

        // Helper: generate TAG UNICO from PLANO + TAG EN PLANO
        // PLANO format: P22-DA-2151-07-GL-001 → extract parts[2]+parts[4]+parts[5]+"."+tagPlano
        function generateTagUnico(plano, tagPlano, material) {
            if (material !== 'P' || !plano || !tagPlano) return '';
            const parts = plano.split('-');
            if (parts.length < 6) return '';
            return parts[2] + parts[4] + parts[5] + '.' + tagPlano;
        }

        // Helper: Generate sequential tag from base tag and index
        // Example: getSequentialTag('M04', 0) → 'M04', getSequentialTag('M04', 1) → 'M05', getSequentialTag('M04', 2) → 'M06'
        function getSequentialTag(baseTag, index) {
            if (!baseTag) return '';

            // Find the numeric part at the end of the tag
            const match = baseTag.match(/^(.*?)(\d+)$/);
            if (!match) return baseTag; // If no number found, return as-is

            const prefix = match[1];
            const number = parseInt(match[2], 10);

            // Calculate new number: base number + index
            const newNumber = number + index;

            // Format with same number of digits (preserve leading zeros)
            const originalDigits = match[2].length;
            const formattedNumber = String(newNumber).padStart(originalDigits, '0');

            return prefix + formattedNumber;
        }

        // Helper: Generate example of sequential tags for display in prompt
        // Example: getSequentialTagsExample('M04', 5) → 'M04, M05, M06, M07, M08'
        function getSequentialTagsExample(baseTag, count) {
            if (!baseTag || count <= 1) return baseTag || '';

            const examples = [];
            for (let i = 0; i < Math.min(count, 5); i++) { // Show max 5 examples
                examples.push(getSequentialTag(baseTag, i));
            }

            let result = examples.join(', ');
            if (count > 5) {
                result += `, ... hasta ${getSequentialTag(baseTag, count - 1)}`;
            }

            return result;
        }

        // ── CACHE
        APP.clearCache = function () {
            if (confirm('¿Eliminar todos los datos locales y restablecer a los valores por defecto? Esto borrará el metrado, reglas y partidas creadas.')) {
                localStorage.removeItem('epc-rules');
                localStorage.removeItem('epc-packages');
                localStorage.removeItem('epc-items');
                location.reload();
            }
        };

        // ── THEME
        APP.toggleTheme = function () {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('epc-theme', isLight ? 'light' : 'dark');
            const tb = document.getElementById('theme-btn');
            if (tb) tb.textContent = isLight ? '🌙' : '☀️';
        };

        // ── INIT
        if (localStorage.getItem('epc-theme') === 'light') {
            document.body.classList.add('light-theme');
            const tb = document.getElementById('theme-btn');
            if (tb) tb.textContent = '🌙';
        }
        loadData();

        // On first load, prompt for PLANO (mandatory)
        if (!localStorage.getItem('epc-plano')) {
            let plano = '';
            while (true) {
                plano = (window.prompt(
                    '⚡ BIENVENIDO A EPC TAKEOFF\n\n' +
                    'Ingresa el PLANO del proyecto.\n' +
                    'Formato requerido (6 partes separadas por guión):\n\n' +
                    '  P22-DA-2151-07-GL-001\n\n' +
                    'Este valor se usará para generar el TAG ÚNICO automáticamente.'
                ) || '').trim().toUpperCase();
                if (plano && plano.split('-').length >= 6) break;
                window.alert(
                    '❌ PLANO inválido.\n\n' +
                    'Debe tener al menos 6 partes separadas por guión.\n' +
                    'Ejemplo: P22-DA-2151-07-GL-001'
                );
            }
            S.customPlano = plano;
            localStorage.setItem('epc-plano', plano);
        }

        APP.render();

        // Keyboard shortcut: Escape closes modal
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('modal-overlay').style.display !== 'none') APP.closeModal();
        });
    </script>
</body>

</html>
